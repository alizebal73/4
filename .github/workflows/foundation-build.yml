name: foundation-build

# CI is intentionally small: restore, build, and test only.

on:
  push:
    branches: ["main", "foundation/**", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Restore
        run: dotnet restore GameNet.slnx
      - name: Build
        run: dotnet build GameNet.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Domain.Tests/GameNet.Domain.Tests.csproj --configuration Release --no-build
