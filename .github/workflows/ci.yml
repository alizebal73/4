name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore GameNetManager.sln

      - name: Build
        run: dotnet build GameNetManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GameNetManager.sln --configuration Release --no-build --no-restore
